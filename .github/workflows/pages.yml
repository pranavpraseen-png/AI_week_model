# Publishes web/ to GitHub Pages. One-time setup: repo Settings -> Pages ->
# Source: "GitHub Actions". GitHub Pages cannot send custom headers, so the
# site relies on the <meta> CSP in each page there; Netlify / Cloudflare Pages
# also apply web/_headers (see docs/03_website_research.md).
name: Publish website

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
